<svg width="900" height="1800" viewBox="0 0 900 1800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="band1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a0f02"/>
      <stop offset="100%" stop-color="#5c1804"/>
    </linearGradient>
    <linearGradient id="band2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a2606"/>
      <stop offset="100%" stop-color="#9c3208"/>
    </linearGradient>
    <linearGradient id="band3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cc4308"/>
      <stop offset="100%" stop-color="#ff6200"/>
    </linearGradient>
    <linearGradient id="band4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8232"/>
      <stop offset="100%" stop-color="#ffa04d"/>
    </linearGradient>
    <linearGradient id="band5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3ba63"/>
      <stop offset="100%" stop-color="#ffd68a"/>
    </linearGradient>
    <linearGradient id="band6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0c8"/>
      <stop offset="100%" stop-color="#fff8e6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="900" height="300" fill="url(#band1)"/>
  <rect x="0" y="300" width="900" height="300" fill="url(#band2)"/>
  <rect x="0" y="600" width="900" height="300" fill="url(#band3)"/>
  <rect x="0" y="900" width="900" height="300" fill="url(#band4)"/>
  <rect x="0" y="1200" width="900" height="300" fill="url(#band5)"/>
  <rect x="0" y="1500" width="900" height="300" fill="url(#band6)"/>

  <!-- top marker -->
  <rect x="0" y="0" width="900" height="130" fill="#000000" opacity="0.28"/>
  <text x="450" y="80" font-family="Arial, sans-serif" font-size="56" font-weight="900" fill="#ffffff" text-anchor="middle">بالای تصویر</text>

  <!-- section labels -->
  <circle cx="450" cy="150" r="150" fill="url(#glow)"/>
  <text x="450" y="175" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="#ffffff" text-anchor="middle">۱ / ۶</text>

  <circle cx="450" cy="450" r="150" fill="url(#glow)"/>
  <text x="450" y="475" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="#ffffff" text-anchor="middle">۲ / ۶</text>

  <circle cx="450" cy="750" r="150" fill="url(#glow)"/>
  <text x="450" y="775" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="#ffffff" text-anchor="middle">۳ / ۶</text>

  <circle cx="450" cy="1050" r="150" fill="url(#glow)"/>
  <text x="450" y="1075" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="#3a0f02" text-anchor="middle">۴ / ۶</text>

  <circle cx="450" cy="1350" r="150" fill="url(#glow)"/>
  <text x="450" y="1375" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="#3a0f02" text-anchor="middle">۵ / ۶</text>

  <circle cx="450" cy="1650" r="150" fill="url(#glow)"/>
  <text x="450" y="1675" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="#3a0f02" text-anchor="middle">۶ / ۶</text>

  <!-- bottom marker -->
  <rect x="0" y="1670" width="900" height="130" fill="#000000" opacity="0.22"/>
  <text x="450" y="1750" font-family="Arial, sans-serif" font-size="56" font-weight="900" fill="#3a0f02" text-anchor="middle">پایین تصویر</text>
</svg>
